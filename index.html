<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f4f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#080b10"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Portfolio of Samir Ajaj, a freelance full-stack developer building multilingual React, TypeScript, Next.js, C#, and .NET applications."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Samir Ajaj — Freelance Full-Stack Developer"
    />
    <meta
      property="og:description"
      content="Multilingual full-stack product work across modern JavaScript and .NET ecosystems."
    />
    <meta
      property="og:image"
      content="https://samirajaj.vercel.app/media/brand/social-preview.svg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Samir Ajaj — Freelance Full-Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Multilingual full-stack product work across modern JavaScript and .NET ecosystems."
    />
    <meta
      name="twitter:image"
      content="https://samirajaj.vercel.app/media/brand/social-preview.svg"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Samir Ajaj — Freelance Full-Stack Developer</title>
    <script>
      (() => {
        const saved = localStorage.getItem("theme")
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
